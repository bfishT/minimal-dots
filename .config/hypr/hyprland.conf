
########################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
#######################################################################################
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XCURSOR_SIZE,8
env = WLR_NO_HARDWARE_CURSORS,1
env = GBM_BACKEND,nvidia-drm
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
exec-once=clash-party
exec-once=fcitx5

xwayland {
    force_zero_scaling = true   
}

exec-once = echo 'Xft.dpi:110' | xrdb -merge




autogenerated = 0 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,1920x1080@144,0x0,1.0
monitor=HDMI-A-1,1920x1080@120,1920x0,1.0
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once=swww-daemon
exec-once=quickshell
exec-once=mako
exec-once=zsh ~/.tmp/pacman.serve
exec-once=hyprctl setcursor Bibata-Modern-Classic 24
exec-once=pulseaudio -k && pulseaudio --start
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


# Some default env vars.

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        scroll_factor = 0.5
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}




general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(c2c1ffee) rgba(f5b2e0aa) 45deg
    col.inactive_border = rgba(47464faa)
    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 10
    shadow:enabled = true
    blur {
        enabled = false
        size = 3
        passes = 3
        new_optimizations = true
        ignore_opacity = true

        #blurls = code
        #blurls = chrome
    }
    # drop_shadow = yes
    shadow:range = 4
    shadow:render_power = 3
    shadow:color = rgba(1a1a1aee)
}

animations {
    enabled = yes
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.05, 1, 0.1, 1.05
    animation = windows, 1, 1, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

#dwindle {
#    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
#    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#    preserve_split = yes # you probably want this
#}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    #workspace_swipe = off
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name = elan1203:00-04f3:307a-touchpad
    sensitivity = 0.5
    enabled = true
}

# Example windowrule v1
# Example windowrule v2
# windowrulev2 = opacity 1 0.88 , 
windowrule {
    name = planify_transparency
    match:class = ^(.*)(planify)$
    opacity = 0.88 0.88
}

windowrule {
    name = planify_workspace
    match:class = ^(.*)(planify)$
    workspace = special:planner
}

windowrule {
    name = maodie
    match:class = ^(.*)(maoduo)(.*)$
    # workspace = special:planner
    border_size = 0
    no_blur = true
    no_shadow = true
    pin = true
    float = true
}

windowrule {
    name = gluqlo_no_anim
    match:class = ^(gluqlo)$
    no_anim = 1
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, /usr/bin/kitty
bind = $mainMod shift, Q, killactive,
bind = $mainMod, Q, exec, alacritty
bind = $mainMod, e, exec, fuzzel --list-executables-in-path -p " " --fuzzy-max-distance 2
bind = $mainMod, d, exec, fuzzel -p "  " --fuzzy-max-distance 2
bind = $mainMod, y, exec, swww img "$(find ~/Pictures/Wallpapers -type f | shuf -n 1)" --transition-type none
bind = $mainMod, f, fullscreen
bind = $mainMod, T, togglefloating



# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
# bind = $mainMod, l, exec, fish ~/.config/hypr/try-move-left.fish
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod+shift, h, movewindow, l
bind = $mainMod+shift, l, movewindow, r
bind = $mainMod+shift, k, movewindow, u
bind = $mainMod+shift, j, movewindow, d

bind = $mainMod, A, exec, ~/.scripts/screenshot.sh
bind = $mainMod+shift, A, exec, grim - | satty --filename - --init-tool crop --fullscreen --copy-command wl-copy --output-filename /home/zxf/Pictures/Screenshots/$(date +%Y-%m-%d-%H-%M-%S).png --early-exit
bind = $mainMod, u, exec, ~/.scripts/lock-all.sh
bind = $mainMod SHIFT, C, exec, /home/zxf/.local/bin/pushclipboard



workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
workspace = 11, monitor:eDP-1, persistent:true

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, backspace, workspace, 11


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, backspace, movetoworkspace,11

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
#禁用mainmod
#bind= SUPER,1,submap,words
submap=words
bind = ctrl, j, exec, ydotool mousemove -a -- 200 475 && ydotool click 0xC0
bind = ctrl, k, exec, ydotool mousemove -a -- 500 475&& ydotool click 0xC0
bind = ctrl, l, exec, ydotool mousemove -a -- 800 475 && ydotool click 0xC0
bind = ctrl, a, exec, ydotool mousemove -a -- 500 200 && ydotool click 0xC0
bind = ctrl, b, exec, ydotool mousemove -a -- 500 275 && ydotool click 0xC0 
bind = ctrl, c, exec, ydotool mousemove -a -- 500 325 && ydotool click 0xC0 
bind = ctrl, d, exec, ydotool mousemove -a -- 500 400 && ydotool click 0xC0 
bind = ctrl, backspace, exec, ydotool mousemove -a -- 920 25 && ydotool click -r 2 0xC0

bind= SUPER,backspace,submap,reset
submap=reset






